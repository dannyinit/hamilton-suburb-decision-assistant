# Render Blueprint: one free web service running the whole app (Express
# serving the API and the built React frontend, over the committed SQLite
# database). See the "Deployment" section of the root README for the steps.
services:
  - type: web
    name: hamilton-suburb-decision-assistant
    runtime: node
    # Free plan: 512 MB / 0.1 CPU, spins down after 15 idle minutes and takes
    # about a minute to wake. Open /api/health shortly before a demo.
    plan: free
    # Closest Render region to New Zealand (the free plan is available in
    # every region).
    region: singapore
    branch: master
    # `npm run build` (root package.json) installs and builds the frontend,
    # then installs the backend. The database ships in the repo, so no Python
    # pipeline runs here.
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      # Exact version, tested locally (build + all 79 regression checks). An
      # unbounded range would resolve to the newest Node major over time, and
      # Vite 8 needs >= 22.12. Bump deliberately, then re-run the checks.
      - key: NODE_VERSION
        value: 22.23.2
